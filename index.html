<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>moomlt · 站点升级中</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f5f6f8" />
<!--
  临时占位页（安全网，仅过渡期使用）：
  本仓库正在从「Deploy from a branch」切换到「GitHub Actions」部署。
  · 切换前：Pages 仍以仓库根为站点根，数据门户实际位于 /public/daily/
  · 切换后：根路径由 Astro 构建出的博客首页接管，本文件即失效可删
  下面的脚本会自动探测门户位置并跳转，无需手动改。
-->
<link rel="canonical" href="https://www.moomlt.com/daily/" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
         background: #f5f6f8; color: #15181e; margin: 0; }
  .card { max-width: 520px; margin: 14vh auto; padding: 32px; background: #fff;
          border: 1px solid #e2e5ea; border-radius: 14px; box-shadow: 0 8px 24px rgba(16,24,40,.06); }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 12px; }
  p { color: #454c58; line-height: 1.7; margin: 0 0 14px; }
  .tag { display: inline-block; font-size: 12px; color: #124a92; background: #e9f0fa;
         border-radius: 999px; padding: 3px 11px; margin-bottom: 14px; }
  a { color: #1a5fb4; }
  .links { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #e2e5ea; font-size: 14px; }
  .links span { color: #6b7383; }
</style>
</head>
<body>
  <div class="card">
    <span class="tag">正在升级为博客主站</span>
    <h1>数据门户已迁移</h1>
    <p>站点结构正在调整：主站改为个人博客，AI 每日观察数据门户移至 <code>/daily/</code>。正在自动跳转……</p>
    <div class="links">
      <span>未自动跳转？</span>
      <a href="/daily/" id="link-primary">进入 AI 每日观察 →</a>
    </div>
  </div>
  <script>
    (function () {
      var candidates = ['/daily/', '/public/daily/'];
      var link = document.getElementById('link-primary');
      function probe(i) {
        if (i >= candidates.length) return;
        fetch(candidates[i], { method: 'HEAD', cache: 'no-store' })
          .then(function (r) {
            if (r.ok) {
              if (link) link.setAttribute('href', candidates[i]);
              window.location.replace(candidates[i]);
            } else {
              probe(i + 1);
            }
          })
          .catch(function () { probe(i + 1); });
      }
      probe(0);
    })();
  </script>
</body>
</html>
